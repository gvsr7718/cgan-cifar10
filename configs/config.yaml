# ==============================================================================
# Conditional Generative Adversarial Network (cGAN) Configuration - CIFAR-10
# All values are configurable defaults tailored for 32x32 RGB image generation.
#
# Dataset Notes:
# - CIFAR-10 provides 50,000 training images and 10,000 official test images.
# - The 50,000 training set will be split into training (90%) and validation (10%) subsets.
# - The official test set (10,000 images) will be reserved for final evaluation.
# - Generated FID evaluation samples (10,000 total) should be balanced across the 10 classes (1,000/class).
# ==============================================================================

# Dataset Configuration
dataset:
  name: "cifar10"
  num_classes: 10
  image_size: 32
  channels: 3

  train_split: 0.90
  validation_split: 0.10

  use_official_test_set: true

  class_names:
    - "airplane"
    - "automobile"
    - "bird"
    - "cat"
    - "deer"
    - "dog"
    - "frog"
    - "horse"
    - "ship"
    - "truck"

# Model Architecture Configuration
model:
  latent_dim: 100       # Dimensionality of the input noise vector z
  num_classes: 10       # Number of conditional class categories
  image_channels: 3     # RGB image channels
  image_size: 32        # Spatial dimension (height and width in pixels)

# Training Hyperparameters & Runtime Configuration
training:
  batch_size: 128       # Mini-batch size for Generator and Discriminator updates
  epochs: 100           # Total number of training epochs
  learning_rate: 0.0002 # Adam optimizer initial learning rate (standard GAN lr)
  beta1: 0.5            # Adam optimizer beta1 parameter (momentum coefficient)
  beta2: 0.999          # Adam optimizer beta2 parameter
  num_workers: 2        # DataLoader worker processes for multi-process data loading
  seed: 42              # Global random seed for reproducible initialization & sampling
  fid_frequency: 10     # Interval (in epochs) at which FID evaluation is triggered

# Evaluation & Metric Benchmark Configuration
evaluation:
  num_fid_images: 10000            # Total synthetic & real images generated for FID computation
  fid_images_per_class: 1000       # Number of generated samples per class for balanced FID calculation
  class_consistency_images: 1000   # Number of synthetic images evaluated via classifier accuracy

# Model Checkpoint & Persistence Configuration
checkpoint:
  metric: "fid"         # Primary metric used to select best model ('fid' or 'loss')
  mode: "min"           # Optimization direction ('min' for FID, 'max' for accuracy)
